name: paperdrawer
description: A local-first drawer for receipts, warranties, and important papers.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  material_ui: ^1.11.1
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
