name: paperdrawer
description: A local-first drawer for receipts, warranties, and important papers.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  material_ui: ^1.11.1
  open_filex: ^5.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  supabase_flutter: ^2.18.3
  uuid: ^4.5.2
  cupertino_ui: ^1.1.7
  cupertino_icons: ^1.0.9
  go_router: ^18.1.4
  camera: ^0.12.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  package_info_plus: ^10.2.2
  archive: ^4.7.1
  lucide_icons_flutter: ^4.0.3
  native_liquid_glass:
    path: third_party/native_liquid_glass
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
