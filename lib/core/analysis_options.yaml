# Stricter rules for the foundation. New code folders opt in with the same
# file (see AGENTS.md §10); legacy folders keep the root rules until rebuilt.
include: ../../analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - unawaited_futures
    - discarded_futures
    - avoid_dynamic_calls
    - prefer_final_locals
