<!-- @dsCard group="Overlays" height=470 subtitle="Add to your drawer" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-wrap:wrap;gap:32px;padding:28px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}
.zig{-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.stub{-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.phone{width:360px;background:var(--bg);border:1px solid var(--hairline);border-radius:28px;overflow:hidden;position:relative}
.ico{width:24px;height:24px;flex-shrink:0}

.ph2{width:360px;height:440px;border-radius:28px;overflow:hidden;position:relative;background:var(--bg);border:1px solid var(--hairline)}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--surface-2);border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-sheet);padding:8px 16px 28px}
.gr{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.h{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:26px;letter-spacing:-.02em;padding:0 4px}
.sub{font-size:15px;color:var(--text-muted);padding:4px 4px 12px}
.o{display:flex;align-items:center;gap:14px;min-height:64px;padding:0 4px;border-top:1px solid var(--hairline)}
.oi{width:44px;height:44px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ot{flex:1;display:flex;flex-direction:column}.ot b{font-size:16px;font-weight:600}.ot span{font-size:13px;color:var(--text-muted)}
.bgcard{margin:60px 16px 0;height:120px;background:var(--paper);border-radius:var(--radius-sm)}
</style>
</head>
<body>
<div class="wrap"><div class="ph2"><div class="bgcard"></div><div class="scrim"></div>
<div class="sh"><div class="gr"></div><div class="h">Add to your drawer</div><div class="sub">Bills, policies, vehicle papers, agreements.</div>
<div class="o"><span class="oi" style="background:var(--lime);color:var(--on-lime)"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="ot"><b>Scan with camera</b><span>We read the dates and amounts</span></span><span style="color:var(--text-subtle)"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></div>
<div class="o"><span class="oi" style="background:var(--surface-3);color:var(--text)"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"/></svg></span><span class="ot"><b>Upload a photo or PDF</b><span>From Files, Photos or email</span></span><span style="color:var(--text-subtle)"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></div>
<div class="o"><span class="oi" style="background:var(--surface-3);color:var(--text)"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></span><span class="ot"><b>Type it in</b><span>No document? Add the details</span></span><span style="color:var(--text-subtle)"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></div></div></div></div>
</body>
</html>
