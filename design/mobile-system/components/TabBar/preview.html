<!-- @dsCard group="Navigation" height=300 subtitle="Floating glass dock" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-wrap:wrap;gap:32px;padding:28px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}
.zig{-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.stub{-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.phone{width:360px;background:var(--bg);border:1px solid var(--hairline);border-radius:28px;overflow:hidden;position:relative}
.ico{width:24px;height:24px;flex-shrink:0}

nav{position:absolute;inset:auto 14px 24px;display:flex;gap:2px;padding:4px;border-radius:var(--radius-pill);background:linear-gradient(180deg,rgba(34,43,39,.84),rgba(14,19,17,.91));border:1px solid rgba(255,255,255,.20);box-shadow:0 10px 24px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.android nav{bottom:16px;background:linear-gradient(180deg,rgba(31,39,35,.9),rgba(14,19,17,.96))}
.ti{flex:1;min-width:0;min-height:52px;padding:4px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-2);border-radius:var(--radius-pill)}
.ti[aria-current="page"]{background:rgba(242,244,239,.14);color:var(--lime)}
.ti.add{color:var(--lime)}
.tl{font-family:var(--font-mono);font-size:10px;font-weight:600;line-height:12px}
.plus{display:grid;place-items:center;width:32px;height:24px;border-radius:var(--radius-pill);background:var(--lime);color:var(--on-lime)}
.plus .ico{width:18px;height:18px}
.sample-paper{margin:24px 18px 0;padding:17px 16px 90px;background:var(--paper);color:var(--ink);border-radius:var(--radius-xs)}
.sample-paper strong{display:block;margin:10px 0}
.sample-paper .mono{font-size:11px}
.home{height:34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.home span{width:134px;height:5px;border-radius:3px;background:var(--text)}
.gest{height:16px;display:flex;align-items:center;justify-content:center}
.gest span{width:108px;height:4px;border-radius:2px;background:var(--text-subtle)}
</style>
</head>
<body>
<div class="wrap">
<div class="col"><span class="cap">iOS</span>
<div class="phone">
<div class="sample-paper"><span class="mono">BILL · ONLINE ORDER</span><strong class="disp">Wireless earbuds</strong><span class="mono">RETURN WINDOW · 2 DAYS</span></div>
<nav aria-label="App">
<span class="ti"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v11h-6v-7H9v7H3z"/></svg><span class="tl">HOME</span></span>
<span class="ti" aria-current="page"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M10 7.5h4M10 16.5h4"/></svg><span class="tl">VAULT</span></span>
<span class="ti add"><span class="plus"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="tl">ADD</span></span>
<span class="ti"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="tl">SETTINGS</span></span>
</nav>
<div class="home"><span></span></div>
</div></div>
<div class="col"><span class="cap">Android</span>
<div class="phone android">
<div class="sample-paper"><span class="mono">BILL · ONLINE ORDER</span><strong class="disp">Wireless earbuds</strong><span class="mono">RETURN WINDOW · 2 DAYS</span></div>
<nav aria-label="App">
<span class="ti" aria-current="page"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v11h-6v-7H9v7H3z"/></svg><span class="tl">HOME</span></span>
<span class="ti"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M10 7.5h4M10 16.5h4"/></svg><span class="tl">VAULT</span></span>
<span class="ti add"><span class="plus"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="tl">ADD</span></span>
<span class="ti"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span class="tl">SETTINGS</span></span>
</nav>
<div class="gest"><span></span></div>
</div></div>
</div>
</body>
</html>
