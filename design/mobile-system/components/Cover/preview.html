<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Inter:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
html,body{margin:0;background:var(--bg)}
.c{position:relative;width:960px;height:300px;overflow:hidden;background:var(--bg)}
svg{position:absolute;left:0;top:0}
.lime{fill:var(--lime)}.paper{fill:var(--paper)}.paper2{fill:var(--paper-2)}.signal{fill:var(--signal)}.ground{fill:var(--bg)}
.ink{fill:none;stroke:var(--ink-2);stroke-width:2}
.perf{fill:none;stroke:var(--bg);stroke-width:3;stroke-dasharray:8 6}
.t{position:absolute;left:48px;bottom:44px;max-width:440px}
.n{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.03em;color:var(--text)}
.g{margin-top:16px;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--text-muted)}
</style>
</head>
<body>
<div class="c">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!--
blocks: lime 168x236 (ticket stub), paper 192x208 (receipt), paper-2 40x300 (document edge), signal 96x68 (due, small)
arrangement: one tall slab with satellites, receipt and document bleeding off the top, the due block off the bottom, all right of x=480
pattern: literal motif (ticket + receipt) — PaperDrawer's objects are torn paper, so the receipt gets its 12px zigzag edge, the stub gets two notches (radius 12) and a perforation
scales: gaps space-6 (24), zigzag pitch space-3 (12), notch r = radius-md (12); document double rule 6 like the DocumentCard
-->
<rect class="lime" x="512" y="0" width="168" height="236"/>
<circle class="ground" cx="512" cy="118" r="12"/>
<circle class="ground" cx="680" cy="118" r="12"/>
<line class="perf" x1="526" y1="118" x2="666" y2="118"/>
<polygon class="paper" points="704,0 896,0 896,196 890,208 884,196 878,208 872,196 866,208 860,196 854,208 848,196 842,208 836,196 830,208 824,196 818,208 812,196 806,208 800,196 794,208 788,196 782,208 776,196 770,208 764,196 758,208 752,196 746,208 740,196 734,208 728,196 722,208 716,196 710,208 704,196"/>
<rect class="signal" x="704" y="232" width="96" height="68"/>
<rect class="paper2" x="920" y="0" width="40" height="300"/>
<line class="ink" x1="920" y1="250" x2="960" y2="250"/>
<line class="ink" x1="920" y1="256" x2="960" y2="256"/>
</svg>
<div class="t"><div class="n">PaperDrawer</div><div class="g">Keep it. Remember it. Claim it. For iOS and Android.</div></div>
</div>
</body>
</html>
