<!-- @dsCard group="Status" height=220 subtitle="Item and claim status" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-wrap:wrap;gap:32px;padding:28px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}
.zig{-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.stub{-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.phone{width:360px;background:var(--bg);border:1px solid var(--hairline);border-radius:28px;overflow:hidden;position:relative}
.ico{width:24px;height:24px;flex-shrink:0}

.s{display:inline-block;padding:3px 8px;border:2px solid;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.12em;border-radius:var(--radius-xs);white-space:nowrap}
.pad{display:flex;flex-wrap:wrap;gap:22px;padding:24px;border-radius:var(--radius-xs);align-items:center}
</style>
</head>
<body>
<div class="wrap" style="flex-direction:column">
<div class="col"><span class="cap">ON PAPER</span><div class="pad" style="background:var(--paper)">
<span class="s" style="color:var(--stamp-due);border-color:var(--stamp-due);transform:rotate(-8deg)">DUE</span><span class="s" style="color:var(--stamp-covered);border-color:var(--stamp-covered);transform:rotate(-10deg)">COVERED</span><span class="s" style="color:var(--stamp-covered);border-color:var(--stamp-covered);transform:rotate(-6deg)">ACTIVE</span><span class="s" style="color:var(--ink);border-color:var(--ink);transform:rotate(-12deg)">IN CLAIM</span><span class="s" style="color:var(--stamp-expired);border-color:var(--stamp-expired);transform:rotate(-9deg)">EXPIRED</span></div></div>
<div class="col"><span class="cap">ON DARK (CLAIMS LIST)</span><div class="pad" style="background:var(--surface-2)">
<span class="s" style="color:var(--text);border-color:var(--text);transform:rotate(0deg)">WAITING</span><span class="s" style="color:var(--signal);border-color:var(--signal);transform:rotate(0deg)">ESCALATE</span><span class="s" style="color:var(--settled);border-color:var(--settled);transform:rotate(0deg)">SETTLED</span></div></div>
</div>
</body>
</html>
