<!-- @dsCard group="Cards" height=300 subtitle="The next deadline, as a torn ticket" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
.wrap{display:flex;flex-wrap:wrap;gap:32px;padding:28px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:12px}
.cap{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.disp{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}
.zig{-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.stub{-webkit-mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 10px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.phone{width:360px;background:var(--bg);border:1px solid var(--hairline);border-radius:28px;overflow:hidden;position:relative}
.ico{width:24px;height:24px;flex-shrink:0}

.tk{display:flex;width:340px;min-height:120px;background:var(--paper);color:var(--ink);border-radius:var(--radius-sm);filter:drop-shadow(0 18px 24px rgba(0,0,0,0.35))}
.s1{flex:0 0 100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-right:2px dashed var(--paper-dash);padding:12px}
.n{font-family:var(--font-display);font-weight:800;font-size:52px;line-height:48px;letter-spacing:-.04em}
.u{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em}
.s2{flex:1;min-width:0;padding:16px 20px 16px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.kk{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--due-ink)}
.tt{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:24px;letter-spacing:-.02em}
.sb{font-size:15px;line-height:22px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="wrap">
<div class="stub tk"><div class="s1"><span class="n">2</span><span class="u">DAYS</span></div>
<div class="s2"><span class="kk">RETURN WINDOW CLOSES</span><span class="tt">Wireless earbuds</span><span class="sb">Return by 20 Nov</span></div></div>
<div class="stub tk"><div class="s1"><span class="n">12</span><span class="u">DAYS</span></div>
<div class="s2"><span class="kk">POLICY RENEWS</span><span class="tt">Family health policy</span><span class="sb">Renew before 30 Nov</span></div></div>
</div>
</body>
</html>
