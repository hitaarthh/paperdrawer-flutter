<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast — preview</title></head>
<body>
<div class="pd-stage"><div style="position:relative;width:393px;height:140px;border-radius:28px;overflow:hidden;background:var(--bg)"><div style="position:absolute;inset:0;padding:16px 20px;display:flex;flex-direction:column;gap:12px"><div class="pd-paper" style="display:flex;flex-direction:column;gap:10px">
  <div class="pd-meta"><span class="label">BILL · CROMA</span><span class="pd-status status due">DUE · 2 DAYS</span></div>
  <div class="card-title">Boat Airdopes 141</div>
  <div><div class="pd-datarow"><span class="data">BOUGHT</span><span class="data pd-num">17.11.2026</span></div><div class="pd-datarow"><span class="data">TOTAL</span><span class="data-strong pd-num">₹1,499</span></div></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="pd-meta"><span class="label">RETURN</span><span class="data pd-num" style="color:var(--due-ink)">2 of 10 days left</span></div><div class="pd-meter due" role="meter" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"><i style="width:20%"></i></div></div>
</div><div class="pd-paper is-doc" style="display:flex;flex-direction:column;gap:10px">
  <div class="pd-meta"><span class="label">POLICY · HDFC ERGO</span><span class="pd-status status covered">COVERED</span></div>
  <div class="card-title">Car insurance</div>
  <div><div class="pd-datarow"><span class="data">RENEWS</span><span class="data pd-num">13.12.2026</span></div><div class="pd-datarow"><span class="data">IDV</span><span class="data-strong pd-num">₹4,20,000</span></div></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="pd-meta"><span class="label">COVER</span><span class="data pd-num" style="color:var(--ink-2)">18 days left</span></div><div class="pd-meter" role="meter" aria-valuenow="6" aria-valuemin="0" aria-valuemax="100"><i style="width:6%"></i></div></div>
</div></div><div style="position:absolute;left:16px;right:16px;bottom:16px"><div class="pd-glass pd-accessory" role="status"><span style="color:var(--settled);display:flex"><svg class="pd-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="subhead">Saved. First reminder on 17 Nov.</span><button class="pd-btn plain sm subhead" style="height:36px">Undo</button></div></div></div><span class="pd-note">AFTER SAVE · ABOVE THE TAB BAR · 4 SECONDS</span></div>
</body>
</html>
