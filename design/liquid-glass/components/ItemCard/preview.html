<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ItemCard — preview</title></head>
<body>
<div class="pd-stage"><div style="display:grid;grid-template-columns:repeat(3,300px);gap:12px;align-items:start">
<div class="pd-paper" style="display:flex;flex-direction:column;gap:10px">
  <div class="pd-meta"><span class="label">BILL · CROMA</span><span class="pd-status status due">DUE · 2 DAYS</span></div>
  <div class="card-title">Boat Airdopes 141</div>

  <div style="display:flex;flex-direction:column;gap:6px"><div class="pd-meta"><span class="label">RETURN</span><span class="data pd-num" style="color:var(--due-ink)">2 of 10 days left</span></div><div class="pd-meter due" role="meter" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"><i style="width:20%"></i></div></div>
</div>
<div class="pd-paper is-doc" style="display:flex;flex-direction:column;gap:10px">

  <div style="display:flex;flex-direction:column;gap:6px"><div class="pd-meta"><span class="label">COVER</span><span class="data pd-num" style="color:var(--ink-2)">18 days left</span></div><div class="pd-meter" role="meter" aria-valuenow="6" aria-valuemin="0" aria-valuemax="100"><i style="width:6%"></i></div></div>
</div>
<div class="pd-paper" style="display:flex;flex-direction:column;gap:10px">
  <div class="pd-meta"><span class="label">BILL · RELIANCE DIGITAL</span><span class="pd-status status ended">ENDED</span></div>
  <div class="card-title">LG washing machine</div>
  <div><div class="pd-datarow"><span class="data">BOUGHT</span><span class="data pd-num">02.09.2023</span></div><div class="pd-datarow"><span class="data">TOTAL</span><span class="data-strong pd-num">₹32,990</span></div></div>
  <div style="display:flex;flex-direction:column;gap:6px"><div class="pd-meta"><span class="label">WARRANTY</span><span class="data pd-num" style="color:var(--ink-2)">Ended 02.09.2025</span></div><div class="pd-meter" role="meter" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i style="width:0%"></i></div></div>
</div>
</div></div>
</body>
</html>
