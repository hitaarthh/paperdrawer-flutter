<!-- @dsCard group="Paper" height=220 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DeadlineCard — preview</title></head>
<body>
<div class="pd-stage"><div style="display:grid;grid-template-columns:repeat(2,353px);gap:12px;align-items:start">
<div class="pd-paper" style="display:grid;grid-template-columns:64px 1fr;gap:0 16px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:2px;padding-right:16px;border-right:1px solid var(--paper-rule);align-self:stretch">
    <span class="figure pd-num" style="color:var(--due-ink)">02</span><span class="label" style="color:var(--due-ink)">DAYS</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
    <span class="label">RETURN WINDOW</span>
    <span class="card-title">Boat Airdopes 141</span>
    <span class="callout" style="color:var(--ink-muted)">Closes Fri, 27 Nov · Croma</span>
  </div>
  <div style="grid-column:1 / -1;margin-top:14px"><div class="pd-meter due" role="meter" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100"><i style="width:20%"></i></div></div>
</div>
<div class="pd-paper is-doc" style="display:grid;grid-template-columns:64px 1fr;gap:0 16px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:2px;padding-right:16px;border-right:1px solid var(--paper-rule);align-self:stretch">
    <span class="figure pd-num" style="color:var(--ink)">18</span><span class="label" style="color:var(--ink)">DAYS</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
    <span class="label">POLICY RENEWAL</span>
    <span class="card-title">Car insurance</span>
    <span class="callout" style="color:var(--ink-muted)">Renews 13 Dec · HDFC Ergo</span>
  </div>
  <div style="grid-column:1 / -1;margin-top:14px"><div class="pd-meter" role="meter" aria-valuenow="6" aria-valuemin="0" aria-valuemax="100"><i style="width:6%"></i></div></div>
</div>
</div></div>
</body>
</html>
